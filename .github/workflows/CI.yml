name: CI
on: pull_request
permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  test:
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      # Get projects set up
      - run: pnpm install
      - run: pnpm bootstrap
      - run: pnpm build

      - name: Assert the pinned native engine under test
        env:
          SVELTE_LS_TSGO_PACKAGE: "@typescript/native-preview"
        run: |
          node -e "
            const packageName = process.env.SVELTE_LS_TSGO_PACKAGE;
            const pins = [
              './package.json',
              './packages/language-server/package.json',
              './packages/svelte-check/package.json'
            ].map(file => ({ file, version: require(file).devDependencies?.[packageName] }));
            for (const pin of pins) {
              if (typeof pin.version !== 'string' || !pin.version) {
                throw new Error(pin.file + ' does not pin ' + packageName);
              }
            }
            const expected = pins[0].version;
            if (pins.some(pin => pin.version !== expected)) {
              throw new Error('native-engine pins differ: ' + pins.map(pin => pin.file + '=' + pin.version).join(', '));
            }
            const { resolveTsGoEngine } = require('./packages/language-server/dist/src/plugins/typescript-go/lsp/TsGoEngine.js');
            const engine = resolveTsGoEngine(process.cwd());
            if (!engine) throw new Error('the pinned native engine did not resolve');
            if (engine.packageName !== packageName) throw new Error('resolved ' + engine.packageName);
            if (engine.version !== expected) throw new Error('expected ' + expected + ', resolved ' + engine.version);
            console.log(engine.packageName + '@' + engine.version + ' -> ' + engine.binPath);
          "

      # Run any tests
      - run: pnpm test
        env:
          CI: true
      - run: pnpm test:tsgo-oracle

  test-svelte5:
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      # Lets us use one-liner JSON manipulations the package.json files
      - run: "npm install -g json"

      # Get projects set up
      - run: json -I -f package.json -e 'this.pnpm={"overrides":{"svelte":"^5.0.0-next.100"}}'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm bootstrap
      - run: pnpm build

      # Run any tests
      - run: pnpm test
        env:
          CI: true
      - run: pnpm test:tsgo-oracle

  lint:
    permissions: {}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: pnpm

      # Get projects set up
      - run: pnpm install
      - run: pnpm lint
