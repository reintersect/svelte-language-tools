# Opens a PR when a new @reintersect/effect-tsgo lands on npm.
#
# Polls the registry rather than taking a repository_dispatch from the effect-tsgo repo. Event
# driven would be tidier, but it needs a PAT in *both* repos and the registry is the thing that
# actually matters — a version nobody published is a version nobody can install.
#
# Needs a FORK_PAT secret. Not by choice: this org's enterprise policy pins
# `default_workflow_permissions` to `read` and refuses to let a repository raise it
# ("Write permissions for workflows are disabled by the enterprise"), so the built-in
# GITHUB_TOKEN cannot open a pull request no matter what `permissions:` says below. A fine-grained
# token scoped to this one repository with Contents: read/write and Pull requests: read/write is
# the minimum that works. The fallback to github.token is there so the job still runs (and fails
# visibly at the PR step) if the secret is missing.
name: fork · effect-tsgo update

on:
  schedule:
    # Every 6 hours. GitHub drops scheduled runs on inactive forks after 60 days, so if this goes
    # quiet, push anything to wake it.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest and pinned versions
        id: v
        run: |
          set -euo pipefail
          latest=$(npm view @reintersect/effect-tsgo version)
          # Both runtime consumers must test the same engine. A mismatched pin is treated as stale
          # so the updater repairs it instead of accidentally exercising native-preview in one.
          pinned=$(node -p "
            const files = [
              './packages/language-server/package.json',
              './packages/svelte-check/package.json'
            ];
            const versions = files.map(f => {
              const p = require(f);
              return (p.devDependencies?.['@reintersect/effect-tsgo']
                ?? p.dependencies?.['@reintersect/effect-tsgo']
                ?? '').replace(/^[^0-9]*/, '') || 'none';
            });
            new Set(versions).size === 1 ? versions[0] : 'mismatched'
          ")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "changed=$([ "$latest" != "$pinned" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Pin the new version
        if: steps.v.outputs.changed == 'yes'
        run: |
          LATEST='${{ steps.v.outputs.latest }}' node -e "
            const fs = require('fs');
            for (const f of [
              'packages/language-server/package.json',
              'packages/svelte-check/package.json'
            ]) {
              const p = JSON.parse(fs.readFileSync(f, 'utf8'));
              (p.devDependencies ??= {})['@reintersect/effect-tsgo'] = process.env.LATEST;
              fs.writeFileSync(f, JSON.stringify(p, null, 4) + '\n');
            }
          "

      - uses: pnpm/action-setup@v4
        if: steps.v.outputs.changed == 'yes'
      - uses: actions/setup-node@v4
        if: steps.v.outputs.changed == 'yes'
        with:
          node-version: 24
          cache: pnpm

      # Resolve and exercise the package explicitly. Falling through to native-preview would make
      # this updater green without testing the version it proposes.
      - name: Install, build and test against it
        if: steps.v.outputs.changed == 'yes'
        id: verify
        env:
          SVELTE_LS_TSGO_PACKAGE: '@reintersect/effect-tsgo'
          EXPECTED_TSGO_VERSION: ${{ steps.v.outputs.latest }}
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter svelte2tsx build
          pnpm --filter @reintersect/svelte-language-server build
          node -e "
            const { resolveTsGoEngine } = require('./packages/language-server/dist/src/plugins/typescript-go/lsp/TsGoEngine.js');
            const engine = resolveTsGoEngine(process.cwd());
            if (!engine) throw new Error('effect-tsgo did not resolve');
            if (engine.packageName !== process.env.SVELTE_LS_TSGO_PACKAGE) throw new Error('resolved ' + engine.packageName);
            if (engine.version !== process.env.EXPECTED_TSGO_VERSION) throw new Error('resolved ' + engine.version);
            console.log(engine.packageName + '@' + engine.version + ' -> ' + engine.binPath);
          "
          pnpm --filter @reintersect/svelte-language-server test
          cd packages/svelte-check && npx rollup -c && pnpm test:sanity && pnpm test:flush

      - name: Open the PR
        if: always() && steps.v.outputs.changed == 'yes'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.FORK_PAT || github.token }}
          branch: fork/effect-tsgo-${{ steps.v.outputs.latest }}
          base: tsgo-engine
          title: 'chore: effect-tsgo ${{ steps.v.outputs.pinned }} → ${{ steps.v.outputs.latest }}'
          commit-message: 'chore: bump @reintersect/effect-tsgo to ${{ steps.v.outputs.latest }}'
          labels: dependencies, effect-tsgo
          body: |
            `@reintersect/effect-tsgo` went from `${{ steps.v.outputs.pinned }}` to
            `${{ steps.v.outputs.latest }}`.

            Required build + tests against the explicitly resolved new binary:
            **${{ steps.verify.outcome }}**

            tsgo tracks TypeScript 7 nightlies, so the things most likely to break are the ones
            this fork depends on that are not stable API: the undocumented `tsgo --lsp -stdio`
            entry point, `custom/initializeAPISession`, and the `--pretty`/`--listFiles` output
            shapes that `svelte-check --tsgo` parses. If the sanity tests went red, start there.
